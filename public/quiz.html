<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz · ClosestGeo</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">ClosestGeo</a>
        <nav class="topbar-actions">
            <div class="unit-toggle" role="group" aria-label="Distance units">
                <button type="button" data-unit="mi">mi</button>
                <button type="button" data-unit="km">km</button>
            </div>
            <a class="button" href="/">Search</a>
        </nav>
    </header>

    <main class="results">
        <div id="map"></div>

        <aside class="panel info-card" id="quizCard" hidden>
            <nav class="segmented" aria-label="Quiz mode">
                <a href="/quiz.html?mode=daily" id="modeDaily">Daily</a>
                <a href="/quiz.html?mode=practice" id="modePractice">Practice</a>
            </nav>

            <div class="segmented" id="difficulty" role="group" aria-label="Difficulty" hidden>
                <button type="button" data-difficulty="easy">Easy</button>
                <button type="button" data-difficulty="medium">Medium</button>
                <button type="button" data-difficulty="hard">Hard</button>
            </div>

            <div id="question">
                <p class="muted" id="progress"></p>
                <h1>Which country is this?</h1>
                <p id="prompt"></p>
                <div class="quiz-choices" id="choices"></div>
                <div id="reveal" hidden>
                    <div class="country-heading">
                        <img id="revealFlag" alt="">
                        <p id="revealText"></p>
                    </div>
                    <button type="button" class="button" id="nextRound">Next</button>
                </div>
            </div>

            <div id="dailySummary" hidden>
                <h1 id="summaryTitle"></h1>
                <p id="summaryScore"></p>
                <p class="daily-squares" id="summarySquares" aria-hidden="true"></p>
                <button type="button" class="button" id="shareResult">Share result</button>
                <p class="muted" id="nextChallenge"></p>
                <p><a class="text-link" href="/quiz.html?mode=practice">Practice while you wait</a></p>
            </div>
        </aside>

        <div class="overlay" id="loading">
            <p class="loading">Loading…</p>
        </div>

        <div class="overlay" id="error" hidden>
            <div class="panel error-card">
                <h2>Quiz unavailable</h2>
                <p id="errorMessage"></p>
                <button type="button" class="button" id="retry">Try again</button>
            </div>
        </div>
    </main>

    <script src="/js/shape.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/quiz.js"></script>
</body>
</html>
