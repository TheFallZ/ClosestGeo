<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats · ClosestGeo</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">ClosestGeo</a>
        <nav class="topbar-actions">
            <a class="text-link" href="/quiz.html">Quiz</a>
            <a class="button" href="/">Search</a>
        </nav>
    </header>

    <main class="stats-page">
        <h1>Stats</h1>
        <p class="muted" id="since"></p>

        <div class="stat-tiles" id="tiles"></div>

        <section class="panel stats-panel">
            <h2>Searches, last 30 days</h2>
            <div class="day-chart" id="days" role="img"></div>
            <div class="day-axis" id="dayAxis"></div>
        </section>

        <div class="stats-grid">
            <section class="panel stats-panel">
                <h2>Most matched countries</h2>
                <div class="bars" id="countries"></div>
            </section>
            <section class="panel stats-panel">
                <h2>Distance between places</h2>
                <div class="bars" id="distances"></div>
            </section>
            <section class="panel stats-panel">
                <h2>Compared with</h2>
                <div class="bars" id="options"></div>
            </section>
            <section class="panel stats-panel">
                <h2>Practice quiz accuracy</h2>
                <div class="bars" id="accuracy"></div>
            </section>
            <section class="panel stats-panel">
                <h2>Daily challenge scores</h2>
                <div class="bars" id="dailyScores"></div>
            </section>
        </div>

        <p class="muted">Only counts are kept: matched countries, distance ranges and quiz results. Addresses, locations and IP addresses are never stored.</p>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/stats.js"></script>
</body>
</html>
