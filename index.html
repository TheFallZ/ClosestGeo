<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClosestGeo</title>
    <!-- Include Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDDjQQUJWGM-QMnkXisfDyznRgrHxBCArI"></script>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <style>
        body {
        
    background: linear-gradient(to bottom right, #000000, #000000); /* Gradient background */
    color: #fff; /* Text color */
    font-family: Arial, sans-serif; /* Font style */
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    
}

.container {
    text-align: center;
}

h1 {
    font-size: 2.5em;
    margin-bottom: 20px;
}

.address-form {
    background-color: rgba(255, 255, 255, 0.1); /* Transparent input background */
    border-radius: 10px;
    padding: 20px;
    display: inline-block;
}

.input-container {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 5px;
}

input, select {
    width: 300px;
    padding: 10px;
    border: none;
    border-bottom: 1px solid #fff;
    background-color: transparent;
    color: #fff;
    font-size: 16px;
    outline: none;
}

button {
    background-color: #ff6b6b;
    border: none;
    color: #fff;
    padding: 15px 32px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    margin-top: 10px;
    cursor: pointer;
    border-radius: 8px;
    transition: background-color 0.3s ease;
    
}

#result img {
    max-width: 60%; /* Ensure the image doesn't exceed its container's width */
    height: auto; /* Maintain the aspect ratio */
    display: block; /* Remove any extra spacing caused by inline elements */
    margin: 0 auto; /* Center the image horizontally within its container */
    border: 2px solid white; /* Add a white border around the image */
    border-radius: 8px; /* Optional: Add border radius for rounded corners */
}
#result {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.flag-container {
    margin-bottom: 20px; /* Adjust the spacing between the flag and the text */
}

.flag-info {
    text-align: center;
}

.flag-container img {
    max-width: 100px; /* Adjust the size of the flag */
}
.distance-entry {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 10px; /* Add some spacing between the distance option and the submit button */
}

.distance-entry label {
    font-weight: bold; /* Make the label text bold */
    margin-bottom: 5px; /* Add some spacing below the label */
}

.distance-entry select {
    width: 220px; /* Set a specific width for the select element */
    padding: 5px; /* Add some padding to the select element */
    border: 2px solid white; /* Add a white border around the select element */
    border-radius: 5px; /* Optional: Add border radius for rounded corners */
    background-color: black; /* Set the background color of the select element */
    color: white; /* Set the text color of the select element */
}

.distance-entry select option {
    background-color: black; /* Set the background color of the options */
    color: white; /* Set the text color of the options */
}

.distance-entry select:hover,
.distance-entry select:focus {
    outline: none; /* Remove the default focus outline */
    border-color: #ccc; /* Change the border color on hover or focus */
}

button:hover {
    background-color: #e05252;
}
    </style>
 <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Function to adjust the map size after the flag is loaded
        function adjustMapSize() {
            const map = document.getElementById('map');
            const flagImage = document.querySelector('#result img');
            if (flagImage) {
                const flagImageHeight = flagImage.offsetHeight;
                map.style.height = `calc(60vh - ${flagImageHeight}px)`;
            }
        }
            // Event listener for when the flag image is loaded
            const flagImage = document.querySelector('#result img');
            flagImage.addEventListener('load', adjustMapSize);

            // If the image is already loaded (e.g., cached), adjust the map size immediately
            if (flagImage.complete) {
                adjustMapSize();
            }
            
        });
    </script>
</head>
<body>
    <div style="text-align:center;">
        <h1>ClosestGeo</h1>
        <form class="addressboxes" id="addressForm">
            <div class="entry" >
            <label for="address1">Address 1:</label> 
            <input type="text" id="address1" name="address1" required> </div>
            <br>
            <div class="entry" >
            <label for="address2">Address 2:</label>
            <input type="text" id="address2" name="address2" required> </div>
            <br>
            <div class="distance-entry" >
            <label for="distanceOption">Distance Option:</label>
            <select id="distanceOption" name="distanceOption">
                <option value="both">Both</option>
                <option value="westEast">West-East</option>
                <option value="northSouth">North-South</option>
            </select>
        </div>
            <br>
            <div class="distance-entry" >
            <button type="submit" id="submitButton">Submit</button>
        </div>
        </form>
    </div>
    <div id="result"></div>
    <div id="map"></div>
    <script>
        document.getElementById('addressForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const address1 = document.getElementById('address1').value;
            const address2 = document.getElementById('address2').value;
            let distanceOption = document.getElementById('distanceOption').value;

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '';

            const submitButton = document.getElementById('submitButton');
            submitButton.disabled = true;
            submitButton.innerText = 'Loading...';

            try {
                const response = await fetch('/find-country', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ address1, address2, distanceOption })
                });

                if (!response.ok) {
                    throw new Error('Server response was not ok.');
                }

                const result = await response.json();
                const distance = result.distance;

                resultDiv.innerHTML = `
                    <h2>Country: ${result.country}</h2>
                    <p>Distance: ${distance} </p>
                    <img src="${result.flagUrl}" alt="Flag of ${result.country}">
                    <p>Distance Option Used: ${result.distanceOptionUsed}</p>
                `;

                const { latitude, longitude } = result.coordinates;

                // Show the map and update it
                document.getElementById('map').style.display = 'block';
                updateMap(latitude, longitude);
            } catch (error) {
                resultDiv.innerHTML = `<h2>Error: ${error.message}</h2>`;
            } finally {
                submitButton.disabled = false;
                submitButton.innerText = 'Submit';
            }
        });

        var map;

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 51.505, lng: -0.09 },
                zoom: 13
            });
        }

        function updateMap(lat, lon) {
            map.setCenter({ lat: lat, lng: lon });
            new google.maps.Marker({
                position: { lat: lat, lng: lon },
                map: map
            });
        }
    </script>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDDjQQUJWGM-QMnkXisfDyznRgrHxBCArI&callback=initMap"></script>
</body>
</html>
